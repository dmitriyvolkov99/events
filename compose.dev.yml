services:

  sqlserver:
    container_name: events-sqlserver


  backend:
    build:
      context: ./backend/Events
      dockerfile: API/Dockerfile

    container_name: events-backend

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development


  frontend:
    build:
      context: ./client-app
      dockerfile: Dockerfile

    container_name: events-frontend