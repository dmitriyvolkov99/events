x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    logging: *default-logging

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    restart: unless-stopped
    logging: *default-logging

    expose:
      - "8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TokenKey: ${TOKEN_KEY}

      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET}

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=Events;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;"

    volumes:
      - dataprotection-keys:/home/app/.aspnet/DataProtection-Keys

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

    depends_on:
      sqlserver:
        condition: service_healthy


  frontend:
    restart: unless-stopped
    logging: *default-logging

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy


volumes:
  sqlserver-data:
  dataprotection-keys: