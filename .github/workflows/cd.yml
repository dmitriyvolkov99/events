name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image owner
        id: set_owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend/Events
          file: ./backend/Events/API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/events-backend:latest
            ghcr.io/${{ steps.set_owner.outputs.owner }}/events-backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./client-app
          file: ./client-app/Dockerfile
          push: true
          build-args: |
            NGINX_CONF=nginx.prod.conf
          tags: |
            ghcr.io/${{ steps.set_owner.outputs.owner }}/events-frontend:latest
            ghcr.io/${{ steps.set_owner.outputs.owner }}/events-frontend:${{ github.event.workflow_run.head_sha }}